        <div style="max-width:800px;margin:2rem auto;padding:0 1.5rem;color:#334155;">
          <h1 style="font-family:'Playfair Display',serif;font-size:2rem;text-align:center;margin-bottom:1rem;">Compare your car with recorded MOT outcomes</h1>
          <p style="text-align:center;margin-bottom:2rem;">Enter your registration to see recorded MOT details and the closest available comparison group. Free, instant, no signup required.</p>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.5rem;margin-top:2rem;">How AutoSafe's MOT Comparison Works</h2>
          <p>AutoSafe uses <strong>148 million recorded DVSA MOT tests</strong> to show the historical failure rate for the closest available group of comparable vehicles. Enter your registration number and postcode to see the recorded MOT context, mileage source, comparison scope and available sample size behind the result.</p>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.5rem;margin-top:2rem;">Why Review Comparable MOT Outcomes?</h2>
          <p>Across the checked-in DVSA aggregate, <strong>about 27% of recorded tests were failures</strong>. When AutoSafe can assess the submitted vehicle's recorded MOT history, it shows the vehicle's predicted chance of failing its next MOT; otherwise it shows a clearly labelled comparison with historical outcomes for the closest supported group. Neither result is a guarantee or a diagnosis.</p>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.5rem;margin-top:2rem;">Common MOT Failure Areas</h2>
          <p>The most common reasons for MOT failure include problems with lighting and signalling, suspension, brakes, and tyres. Where the comparison data supports it, AutoSafe shows component patterns for similar vehicles; it does not diagnose your car.</p>
          <p style="margin-top:1rem;">Explore our guides: <a href="/guides/common-mot-failures">Top 10 MOT Failure Points</a> | <a href="/guides/mot-checklist">Pre-MOT Checklist</a> | <a href="/guides/mot-failure-rates-by-car">MOT Failure Rates by Car</a></p>
