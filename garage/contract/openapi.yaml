openapi: 3.0.3
info:
  title: AutoSafe Garage API
  version: 1.0.0-draft.2
  description: |
    Contract for `/api/garage/v1` (garage pilot, T6b: briefing engine and contract gaps closed).

    Conventions
    - Authentication is a session cookie (`__Host-garage_session`, HttpOnly, Secure, SameSite=Lax), set by
      `POST /auth/links/{token}/consume`. Sessions last 14 days and are revocable.
    - Every private resource is scoped to the workshop of the session. An id that belongs to another workshop
      is indistinguishable from a missing id: the API answers 404 `not_found`.
    - Unsafe methods (POST/PATCH/DELETE) made by a browser must be same-origin; cross-site requests get
      403 `csrf_blocked`.
    - Dates are `YYYY-MM-DD` Europe/London calendar dates. Timestamps are RFC 3339 with the Europe/London
      offset (for example `2026-10-26T09:00:00+00:00` or `2026-07-01T09:00:00+01:00`).
    - Errors always use the `Error` schema.
    - There are no customer name, email or phone fields anywhere. Free-text fields (`note`, workshop
      `name`) must not be used for customer personal data; the UI should say so.
    - Display precision (rounded to the nearest 5 percentage points, low/medium/high band) is decided
      server side by the assessment provider. The client must not compute bands.
    - Pilot scope (Henri, 2026-10-25): assessments are for workshop staff only. The API deliberately has no
      public link, share, print or export (including CSV) endpoint for an assessment; assessments are only
      readable inside an authenticated staff session.
    - Booking and import flows never depend on the assessment state: they succeed whether the assessment is
      pending, available, unavailable, unsupported or failed.
    - The assessment provider in this first pass is a stub: every supported booking resolves to
      `unavailable` with reason `model_not_packaged`.

    T6b additions (the nine gaps reported by the web client)
    1. Briefing: `GET /bookings/{booking_id}/briefing`. Generated by fixed, versioned rules from the stored
       source snapshot, independently of the assessment (it exists whether or not a model estimate does). It never
       explains or mentions a model score. Historical defects are always described in the past tense with
       their test date. Identity = snapshot sha256 + rule-table version (`briefing_version`).
    2. Feedback: `PUT /bookings/{booking_id}/feedback`. helpful / not_helpful with an optional reason code, one per
       member per booking version (assessment version); sending again replaces it.
    3. Demo data: NOT served by this API. The public fictional demo (`/demo`) is client-side only, built from
       invented registrations (`DEMOnn`); no endpoint, table or cache holds demo data.
    4. Rounding step and band edges: every completed assessment that went through a provider carries
       `display_policy` (`rounding_pp`, `band_edges`, `band_labels`, `provisional`). They come from the model
       package; until one exists the stub supplies them and marks them `provisional: true`.
    5. Ranking: an available assessment carries `rank_key`, an order-only integer (larger = higher estimated
       risk). It is derived server side from the unrounded score, which is never sent to a client. It is not a
       probability and is only comparable within one list response.
    6. Appointment time: optional `appointment_time` (`HH:MM`, 24-hour, Europe/London) on bookings and import
       rows. Display and ordering only; it is not part of a booking's identity (registration + date + type)
       and is not a model input.
    7. Import progress: `POST /imports/{import_id}/commit` queues a job and answers 202 at once; poll
       `GET /imports/{import_id}` for `status` (`committing`, `committed`, `failed`) and `progress`
       (`processed` of `total`).
    8. Sign-in confirm page: the server-rendered `GET /auth/links/{token}` page is the only confirm page. The web
       app has no equivalent route. After the form `POST`s to `.../consume` the browser is redirected (303) to
       `{app_url}/app`.
    9. Onboarding: signup is unchanged.
servers:
  - url: /api/garage/v1
tags:
  - name: auth
  - name: account
  - name: imports
  - name: bookings
  - name: decisions
  - name: system
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and database reachability (no workshop data)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        '503':
          $ref: '#/components/responses/Error'
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Create a workshop with an invite code (R12). Sends a sign-in link to the owner email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code, workshop_name, email]
              additionalProperties: false
              properties:
                invite_code: {type: string, maxLength: 64}
                workshop_name: {type: string, minLength: 1, maxLength: 120}
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202':
          description: Workshop created; a sign-in link has been emailed. Nothing is accessible until the link is used.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Accepted'}
        '403':
          description: Invite code unknown, used or expired (`invalid_invite`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          $ref: '#/components/responses/Error'
  /auth/login-links:
    post:
      tags: [auth]
      operationId: requestLoginLink
      summary: Email a single-use sign-in link (valid 15 minutes)
      description: |
        Always answers 202 whether or not the email has an account (no account enumeration). At most five
        links per account per hour are sent; extra requests are silently dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: {type: string, format: email, maxLength: 254}
                workshop_id:
                  type: string
                  format: uuid
                  description: Optional. Choose which workshop to sign in to when the email belongs to several.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Accepted'}
        '422':
          $ref: '#/components/responses/Error'
  /auth/links/{token}:
    get:
      tags: [auth]
      operationId: showLoginLink
      summary: Confirm page for a sign-in link. Never consumes the link (prefetch-safe).
      description: |
        Returns a small HTML page with a form that POSTs to `/auth/links/{token}/consume`. Mail scanners and
        browser prefetchers that follow the link therefore cannot use it up. 410 if the link is unknown,
        expired or already used.
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: 'Confirm page (Cache-Control no-store, Referrer-Policy no-referrer)'
          content:
            text/html:
              schema: {type: string}
        '410':
          description: Link invalid, expired or used (HTML page).
          content:
            text/html:
              schema: {type: string}
  /auth/links/{token}/consume:
    post:
      tags: [auth]
      operationId: consumeLoginLink
      summary: Consume the link (single use) and start a session
      description: |
        Atomic: exactly one concurrent request can consume a link. Accepts a JSON or form body (empty is
        fine). With `Accept: application/json` it answers 200 JSON; otherwise it answers 303 to the app.
        The response sets the session cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema: {type: string}
              description: __Host-garage_session=...; Path=/; Max-Age=1209600; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '303':
          description: Signed in (HTML form flow); redirects to the app.
        '403':
          $ref: '#/components/responses/Error'
        '410':
          description: Link invalid, expired or already used (`link_invalid`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Error'}
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Current user, role and workshop
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Error'}
  /sessions:
    get:
      tags: [account]
      operationId: listSessions
      summary: Active sessions. Staff see their own; the owner sees the whole workshop.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
  /sessions/{session_id}:
    delete:
      tags: [account]
      operationId: revokeSession
      summary: Revoke a session. Staff can revoke their own; the owner can revoke any in the workshop.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workshop:
    get:
      tags: [account]
      operationId: getWorkshop
      summary: The signed-in workshop, with fair-use usage today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workshop'}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      tags: [account]
      operationId: updateWorkshop
      summary: Rename the workshop (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workshop'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /staff:
    get:
      tags: [account]
      operationId: listStaff
      summary: Members of the workshop (owner and staff)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [account]
      operationId: addStaff
      summary: Add a staff member and email them a sign-in link (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: Already an active member (`already_member`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /staff/{membership_id}:
    delete:
      tags: [account]
      operationId: removeStaff
      summary: Remove a staff member and revoke their sessions (owner only; the owner cannot be removed)
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: Target is the owner (`cannot_remove_owner`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /imports/preview:
    post:
      tags: [imports]
      operationId: previewImport
      summary: Parse and validate rows without creating bookings
      description: |
        Up to 200 data rows per request (`too_many_rows` 422 otherwise; nothing is stored). Required per row:
        registration, date, type. Row problems never fail the request; each row reports its own status.
        A preview stays committable for one hour.

        Formats
        - `paste`: one booking per line, fields separated by tab, comma, semicolon or whitespace, in the order
          registration, date, type. A header line is detected and skipped.
        - `csv`: RFC 4180 text with a header row naming `registration`, `date`, `type` (aliases: `reg`, `vrm`,
          `appointment_date`, `booking_type`). Column order is free.
        - `manual`: `rows` array.

        Dates: `YYYY-MM-DD` or `DD/MM/YYYY`. Types: `mot`, `service`, `retest`, `service_mot` plus common
        spellings ("MOT retest", "service + MOT", "full service and mot").
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportRequest'}
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPreview'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /imports/{import_id}/commit:
    post:
      tags: [imports]
      operationId: commitImport
      summary: Queue the creation of the bookings from a preview (idempotent, asynchronous)
      description: |
        Answers 202 immediately with the import in state `committing` and `progress` 0 of N (N = rows that were
        `new`). A background job then creates one booking per `new` row in batches, queues an assessment per
        supported booking and the outcome checks (days 1, 3, 7, 14). Poll `GET /imports/{import_id}`.
        Committing again changes nothing: while it runs you get 202 with the current progress; once finished you
        get 200 with `already_committed: true`. A `failed` import (the job gave up) can be committed again and
        continues from where it stopped. Importing the same registration + date + type again in a later import
        creates no duplicate: those rows come back as `duplicate_existing`.
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '202':
          description: Commit queued or already running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRecord'}
        '200':
          description: 'Already committed (`already_committed: true`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRecord'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410':
          description: Preview expired (`import_expired`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /imports/{import_id}:
    get:
      tags: [imports]
      operationId: getImport
      summary: A preview, a running commit (with progress) or a finished import
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRecord'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bookings:
    get:
      tags: [bookings]
      operationId: listBookings
      summary: Booking list, ordered by appointment date, then appointment time (untimed last), then id
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: booking_type, in: query, schema: {$ref: '#/components/schemas/BookingType'}}
        - {name: assessment_state, in: query, schema: {$ref: '#/components/schemas/AssessmentState'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/BookingStatus'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque; from `next_cursor`.}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Booking'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Add one booking (manual entry, no preview step)
      description: Same validation and idempotency as an import row. An existing booking is returned with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportRow'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '200':
          description: Already existed (`duplicate`); returned unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /bookings/{booking_id}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: One booking with its latest assessment, decision and outcome
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [bookings]
      operationId: updateBooking
      summary: Reschedule, set or clear the time of, or cancel a booking
      description: |
        `appointment_time` (`HH:MM`, or `null` to clear) changes only the time of day; it does not mark the booking
        as rescheduled and does not move outcome checks.
        Rescheduling changes `appointment_date`, keeps `original_appointment_date`, cancels the pending outcome
        checks and schedules new ones from the new date. Existing assessment versions are frozen and are not
        changed. Cancelling cancels pending checks. A cancelled booking cannot be rescheduled.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                appointment_date: {type: string, format: date}
                appointment_time: {type: string, maxLength: 10, nullable: true, description: 'HH:MM, 24-hour, London; null clears it'}
                status: {type: string, enum: [cancelled]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: Booking is cancelled (`booking_cancelled`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /bookings/{booking_id}/assessments:
    get:
      tags: [bookings]
      operationId: listAssessments
      summary: All assessment versions, newest first
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Assessment'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [bookings]
      operationId: refreshAssessment
      summary: Staff refresh. Creates a new assessment version (pending) using tests before today.
      description: |
        Counts toward the fair-use limit of 50 assessments per workshop per London day when it runs.
        429 `fair_use_limit` if the limit is already reached today. Refused with 409 while a version is still
        pending.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '202':
          description: New version queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assessment'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: A version is already pending (`assessment_pending`) or the booking is cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Fair-use limit reached (`fair_use_limit`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /bookings/{booking_id}/briefing:
    get:
      tags: [bookings]
      operationId: getBriefing
      summary: Rule-generated briefing from the stored source snapshot (no model score, no explanation of one)
      description: |
        Built from the stored source snapshot of the newest completed assessment version, using only tests
        strictly before that version's input cutoff (min of import time and appointment date, R10). Same snapshot +
        same `rule_table_version` always gives the same briefing (`briefing_version`). It does not depend on
        whether an estimate exists: a failed or unavailable estimate still has a briefing when history was fetched.

        `status`: `ready` (a snapshot exists), `pending` (no assessment version has finished yet) or `unavailable`
        (no history was ever fetched, for example a service-only or cancelled booking; see `reason`).

        Wording rules: advisories and defects are history. Every defect carries the date of the test it was
        recorded at (`recorded_on`, `label`). Questions and gaps are written in the past tense about the record.
        A failed test whose only failing items are PRS-typed, followed within seconds by a pass, is ONE record with
        `result: RECTIFIED` (T1b).
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Briefing'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bookings/{booking_id}/feedback:
    put:
      tags: [bookings]
      operationId: putFeedback
      summary: Was this briefing helpful? One answer per member per booking version; replaces the previous one.
      description: |
        Scoped to the workshop; the feedback attaches to the newest completed assessment version (the "booking
        version") of the briefing returned by `GET .../briefing`. Send `briefing_version` to make sure it is the
        briefing the member saw (409 `briefing_version_changed` otherwise). 409 `briefing_not_ready` when there is
        no briefing yet. `reason_code` is allowed only with `not_helpful`.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value: {$ref: '#/components/schemas/FeedbackValue'}
                reason_code: {allOf: [{$ref: '#/components/schemas/FeedbackReason'}], nullable: true}
                briefing_version: {type: string, maxLength: 80, nullable: true}
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: No briefing yet (`briefing_not_ready`) or it was regenerated (`briefing_version_changed`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /bookings/{booking_id}/decisions:
    get:
      tags: [decisions]
      operationId: listDecisions
      summary: Full decision history, newest first
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Decision'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [decisions]
      operationId: recordDecision
      summary: Record a decision. History is append-only; the newest row is the current decision.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_type]
              additionalProperties: false
              properties:
                decision_type: {$ref: '#/components/schemas/DecisionType'}
                note:
                  type: string
                  maxLength: 500
                  description: Free text. Must not contain customer personal data.
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /bookings/{booking_id}/outcomes:
    get:
      tags: [bookings]
      operationId: listOutcomes
      summary: Outcome checks for days 1, 3, 7 and 14 after the appointment
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Outcome'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /usage:
    get:
      tags: [account]
      operationId: getUsage
      summary: Fair-use usage for the current London day
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Usage'}
        '401': {$ref: '#/components/responses/Error'}
components:
  parameters:
    Token:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 20, maxLength: 128}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImportId:
      name: import_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    BookingId:
      name: booking_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable machine code, e.g. unauthenticated, forbidden, not_found, validation_error,
                invalid_invite, link_invalid, csrf_blocked, fair_use_limit, too_many_rows, import_expired,
                already_member, cannot_remove_owner, booking_cancelled, assessment_pending, upstream_unavailable,
                briefing_not_ready, briefing_version_changed.
            message: {type: string}
            details: {type: object, additionalProperties: true, nullable: true}
    Accepted:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [accepted]}
    Role:
      type: string
      enum: [owner, staff]
    BookingType:
      type: string
      enum: [mot, service, retest, service_mot]
    BookingStatus:
      type: string
      enum: [active, cancelled]
    AssessmentState:
      type: string
      enum: [pending, available, unavailable, unsupported, failed]
    DecisionType:
      type: string
      enum: [check_repair_history, offer_inspection, adjust_booking_plan, proceed_as_booked]
    Me:
      type: object
      required: [user, workshop, role, memberships]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
        workshop:
          type: object
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        membership_id: {type: string, format: uuid}
        memberships:
          type: array
          description: Every workshop this user belongs to (sign in again with `workshop_id` to switch).
          items:
            type: object
            required: [workshop_id, workshop_name, role]
            properties:
              workshop_id: {type: string, format: uuid}
              workshop_name: {type: string}
              role: {$ref: '#/components/schemas/Role'}
    Session:
      type: object
      required: [id, membership_id, email, created_at, expires_at, current]
      properties:
        id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        email: {type: string, format: email}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time}
        current: {type: boolean}
    Member:
      type: object
      required: [membership_id, email, role, status, created_at]
      properties:
        membership_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        status: {type: string, enum: [active]}
        created_at: {type: string, format: date-time}
    Workshop:
      type: object
      required: [id, name, usage]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        usage: {$ref: '#/components/schemas/Usage'}
    Usage:
      type: object
      required: [date, assessments_used, assessments_limit, assessments_remaining]
      properties:
        date: {type: string, format: date, description: Europe/London day}
        assessments_used: {type: integer}
        assessments_limit: {type: integer, example: 50}
        assessments_remaining: {type: integer}
    ImportRow:
      type: object
      required: [registration, date, type]
      additionalProperties: false
      properties:
        registration: {type: string, maxLength: 20}
        date: {type: string, maxLength: 20, description: 'YYYY-MM-DD or DD/MM/YYYY'}
        type: {type: string, maxLength: 40, description: A BookingType or a common spelling of one.}
        time:
          type: string
          maxLength: 10
          nullable: true
          description: 'Optional appointment time, 24-hour (09:30, 9:30, 0930). Paste and CSV accept a time column or token too.'
    ImportRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: {type: string, enum: [paste, csv, manual]}
        content:
          type: string
          maxLength: 200000
          description: Required for `paste` and `csv`.
        rows:
          type: array
          maxItems: 1000
          description: Required for `manual`. More than 200 rows is rejected with `too_many_rows`.
          items: {$ref: '#/components/schemas/ImportRow'}
    RowStatus:
      type: string
      enum: [new, duplicate_existing, duplicate_in_batch, invalid]
    RowIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Errors: missing_registration, invalid_registration, missing_date, invalid_date, date_out_of_range,
            missing_type, invalid_type, invalid_time. Warning: nonstandard_registration_format.
        field: {type: string, nullable: true}
        message: {type: string}
    PreviewRow:
      type: object
      required: [row_number, status, errors, warnings]
      properties:
        row_number: {type: integer, description: 1-based position among data rows (header excluded)}
        status: {$ref: '#/components/schemas/RowStatus'}
        registration: {type: string, nullable: true, description: Normalised (upper case, no spaces)}
        appointment_date: {type: string, format: date, nullable: true}
        appointment_time: {type: string, nullable: true, description: 'HH:MM or null'}
        booking_type: {allOf: [{$ref: '#/components/schemas/BookingType'}], nullable: true}
        existing_booking_id: {type: string, format: uuid, nullable: true}
        duplicate_of_row: {type: integer, nullable: true}
        errors:
          type: array
          items: {$ref: '#/components/schemas/RowIssue'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/RowIssue'}
    ImportCounts:
      type: object
      required: [total, new, duplicate_existing, duplicate_in_batch, invalid]
      properties:
        total: {type: integer}
        new: {type: integer}
        duplicate_existing: {type: integer}
        duplicate_in_batch: {type: integer}
        invalid: {type: integer}
    ImportPreview:
      type: object
      required: [import_id, status, counts, rows, expires_at]
      properties:
        import_id: {type: string, format: uuid}
        status: {type: string, enum: [previewed]}
        counts: {$ref: '#/components/schemas/ImportCounts'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/PreviewRow'}
        progress: {allOf: [{$ref: '#/components/schemas/ImportProgress'}], nullable: true}
        expires_at: {type: string, format: date-time}
    ImportProgress:
      type: object
      description: N of M. `total` is the number of rows that were `new` when the commit was requested.
      required: [processed, total]
      properties:
        processed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    ImportRecord:
      type: object
      description: |
        An import in any state. `previewed`: nothing created yet. `committing`: the job is creating bookings
        (`progress`). `committed`: finished (`created_booking_ids`). `failed`: the job gave up; commit again to
        continue. `expired`: a preview that was not committed within an hour.
      required: [import_id, status, counts, rows]
      properties:
        import_id: {type: string, format: uuid}
        status: {type: string, enum: [previewed, committing, committed, failed, expired]}
        already_committed: {type: boolean, description: Only on commit responses.}
        counts: {$ref: '#/components/schemas/ImportCounts'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/PreviewRow'}
        progress: {allOf: [{$ref: '#/components/schemas/ImportProgress'}], nullable: true}
        created_booking_ids:
          type: array
          description: Present when `committed`.
          items: {type: string, format: uuid}
        failure_reason: {type: string, description: Present when `failed`.}
        expires_at: {type: string, format: date-time}
        committed_at: {type: string, format: date-time, nullable: true}
    AssessmentResult:
      type: object
      description: Present only when state is `available`.
      required: [percent_rounded, band]
      properties:
        percent_rounded:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          multipleOf: 5
        band: {type: string, enum: [low, medium, high]}
    DisplayPolicy:
      type: object
      description: |
        How the service turned a probability into what is shown (R7). Supplied by the model package; `provisional`
        is true while it is the stub's. The client labels what it is given and never rounds or bands.
      required: [rounding_pp, band_edges, band_labels, provisional]
      properties:
        rounding_pp: {type: integer, enum: [5], description: Percentage points; shown values are multiples of this.}
        band_edges:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: integer, minimum: 1, maximum: 100}
          description: 'On the rounded scale: low below the first edge, medium from the first edge to below the second, high from the second.'
        band_labels:
          type: object
          required: [low, medium, high]
          properties:
            low: {type: string}
            medium: {type: string}
            high: {type: string}
        provisional: {type: boolean}
        display_state: {type: string, enum: [unavailable, shadow, bands, simulated, percentage], description: "Package-owned display authority; unavailable suppresses estimates and ranking."}
        operational_qualified: {type: boolean}
        ranking_enabled: {type: boolean}
        policy_version: {type: string}
        model_version: {type: string, nullable: true}
        suppression_reason: {type: string, nullable: true}
    Assessment:
      type: object
      required: [id, booking_id, version, state, trigger, input_cutoff_date, created_at]
      properties:
        display_policy:
          allOf: [{$ref: '#/components/schemas/DisplayPolicy'}]
          nullable: true
          description: Present once a provider has run for this version (also when no estimate was available).
        rank_key:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Booking-list responses only, when the display policy explicitly permits ranking. Dense ordinal
            computed across the complete filtered workshop cohort before pagination; larger means higher
            server-side risk and equal scores share a key. No score transform is exposed. Comparable only
            within the same filtered cohort and assessment snapshot; detail responses return null.
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/AssessmentState'}
        reason:
          type: string
          nullable: true
          description: |
            Machine reason. Known values: model_not_packaged, service_only, retest_booking, no_mot_history,
            no_prior_mot, booking_cancelled, upstream_retrying, upstream_unavailable, upstream_error,
            fair_use_deferred, provider_error, invalid_provider_output. Providers may add population reasons
            (for example first_mot, not_class_4).
        reason_text: {type: string, nullable: true}
        result:
          allOf: [{$ref: '#/components/schemas/AssessmentResult'}]
          nullable: true
        evidence:
          type: object
          nullable: true
          description: Dated-record summary of the inputs used (evidence gaps are visible here).
          properties:
            prior_test_count: {type: integer}
            latest_prior_test_date: {type: string, format: date, nullable: true}
            history_fetched_at: {type: string, format: date-time}
        trigger: {type: string, enum: [import, manual_entry, refresh]}
        input_cutoff_date:
          type: string
          format: date
          description: Only tests strictly before this date were used (min of import date and appointment date).
        input_cutoff_at: {type: string, format: date-time}
        provider:
          type: object
          nullable: true
          properties:
            name: {type: string}
            version: {type: string}
        retry_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
    Actor:
      type: object
      required: [membership_id, email, role]
      properties:
        membership_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    Decision:
      type: object
      required: [id, booking_id, decision_type, actor, created_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        decision_type: {$ref: '#/components/schemas/DecisionType'}
        note: {type: string, nullable: true}
        actor: {$ref: '#/components/schemas/Actor'}
        assessment_id: {type: string, format: uuid, nullable: true, description: Latest assessment version when the decision was made.}
        supersedes_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
    OutcomeStatus:
      type: string
      description: |
        scheduled: not yet due. matched: exactly one candidate test in the window. no_subsequent_test: none yet
        (final once check_day is 14). ambiguous: more than one candidate; left unresolved on purpose.
        not_applicable: service-only booking. cancelled: booking cancelled or rescheduled away.
        failed: upstream lookup failed on every attempt.
      enum: [scheduled, matched, no_subsequent_test, ambiguous, not_applicable, cancelled, failed]
    TestRef:
      type: object
      required: [test_date, result]
      properties:
        test_date: {type: string, format: date}
        result: {type: string, enum: [PASSED, FAILED]}
        test_number: {type: string, nullable: true}
    Outcome:
      type: object
      required: [id, booking_id, check_day, status, due_at, final]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        check_day: {type: integer, enum: [1, 3, 7, 14]}
        status: {$ref: '#/components/schemas/OutcomeStatus'}
        due_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time, nullable: true}
        matched_test:
          allOf: [{$ref: '#/components/schemas/TestRef'}]
          nullable: true
        candidates:
          type: array
          description: All tests in the matching window (appointment date to day 14).
          items: {$ref: '#/components/schemas/TestRef'}
        detail: {type: string, nullable: true}
        final: {type: boolean, description: True for the day-14 check.}
    Booking:
      type: object
      required: [id, registration, appointment_date, original_appointment_date, booking_type, status, source, created_at]
      properties:
        id: {type: string, format: uuid}
        registration: {type: string}
        appointment_date: {type: string, format: date}
        appointment_time: {type: string, nullable: true, description: 'HH:MM 24-hour London, or null (untimed)'}
        original_appointment_date: {type: string, format: date}
        booking_type: {$ref: '#/components/schemas/BookingType'}
        status: {$ref: '#/components/schemas/BookingStatus'}
        source: {type: string, enum: [import, manual]}
        rescheduled: {type: boolean}
        created_at: {type: string, format: date-time}
        assessment:
          allOf: [{$ref: '#/components/schemas/Assessment'}]
          nullable: true
        decision:
          allOf: [{$ref: '#/components/schemas/Decision'}]
          nullable: true
        outcome:
          allOf: [{$ref: '#/components/schemas/Outcome'}]
          nullable: true
          description: The most recent outcome check that has run (null if none yet).
    FeedbackValue:
      type: string
      enum: [helpful, not_helpful]
    FeedbackReason:
      type: string
      enum: [inaccurate_records, not_relevant, too_long, missing_information, other]
    Feedback:
      type: object
      required: [value, briefing_version, assessment_version, updated_at]
      properties:
        value: {$ref: '#/components/schemas/FeedbackValue'}
        reason_code: {allOf: [{$ref: '#/components/schemas/FeedbackReason'}], nullable: true}
        briefing_version: {type: string}
        assessment_version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    BriefingGapRuleId:
      type: string
      enum: [G01_vehicle_not_found, G02_no_prior_test, G03_short_history, G04_stale_history, G05_missing_odometer,
             G06_odometer_drop, G07_recent_fail_no_pass, G08_prs_without_pass]
    BriefingQuestionRuleId:
      type: string
      enum: [Q01_unresolved_fail, Q02_fail_then_pass, Q03_rectified_at_last_test, Q04_repeat_advisory,
             Q05_last_test_advisory]
    BriefingDefect:
      type: object
      required: [type, dangerous, text, recorded_on, label]
      properties:
        type:
          type: string
          description: ADVISORY, MINOR, MAJOR, DANGEROUS, PRS (rectified at the test) or another value the source used.
        dangerous: {type: boolean}
        text: {type: string, description: The source's wording, verbatim. A quotation of a past record, not a statement about today.}
        recorded_on: {type: string, format: date, description: The test date it was recorded at.}
        label: {type: string, description: 'For example "Advisory, recorded at test on 21 July 2026".'}
    BriefingRecord:
      type: object
      description: One test event, newest first. A PRS-typed fail plus the pass seconds later is ONE record, RECTIFIED.
      required: [test_date, result, odometer_value, odometer_unit, defects]
      properties:
        test_date: {type: string, format: date}
        result: {type: string, enum: [PASSED, FAILED, RECTIFIED]}
        odometer_value: {type: integer, nullable: true}
        odometer_unit: {type: string, enum: [MI, KM], nullable: true}
        defects:
          type: array
          items: {$ref: '#/components/schemas/BriefingDefect'}
    BriefingGap:
      type: object
      required: [rule_id, text]
      properties:
        rule_id: {$ref: '#/components/schemas/BriefingGapRuleId'}
        text: {type: string}
    BriefingQuestion:
      type: object
      required: [id, rule_id, text, source_test_date]
      properties:
        id: {type: string, description: Stable for the same snapshot and rule table.}
        rule_id: {$ref: '#/components/schemas/BriefingQuestionRuleId'}
        text: {type: string}
        source_test_date: {type: string, format: date, nullable: true}
    Briefing:
      type: object
      required: [booking_id, status, rule_table_version, briefing_version, summary, source_records, evidence_gaps,
                 follow_up_questions, feedback]
      properties:
        booking_id: {type: string, format: uuid}
        status: {type: string, enum: [ready, pending, unavailable]}
        reason: {type: string, nullable: true, description: Same vocabulary as Assessment.reason; set when not ready.}
        reason_text: {type: string, nullable: true}
        rule_table_version: {type: string, example: briefing-rules-1}
        briefing_version: {type: string, nullable: true, description: 'First 16 hex of the snapshot sha256, then the rule-table version.'}
        assessment_id: {type: string, format: uuid, nullable: true, description: The assessment version whose snapshot was used.}
        assessment_version: {type: integer, nullable: true}
        history_cutoff_date: {type: string, format: date, nullable: true, description: Only tests strictly before this date are used.}
        history_cutoff_at: {type: string, format: date-time, nullable: true}
        source:
          type: object
          nullable: true
          required: [snapshot_sha256, upstream_status, fetched_at]
          properties:
            snapshot_sha256: {type: string}
            upstream_status: {type: string, enum: [ok, not_found]}
            fetched_at: {type: string, format: date-time}
        summary: {type: string, nullable: true, description: Template text from fixed rules (S01/S02). Never mentions an estimate.}
        source_records:
          type: array
          description: The last 5 test events before the cutoff, newest first.
          items: {$ref: '#/components/schemas/BriefingRecord'}
        evidence_gaps:
          type: array
          items: {$ref: '#/components/schemas/BriefingGap'}
        follow_up_questions:
          type: array
          items: {$ref: '#/components/schemas/BriefingQuestion'}
        feedback:
          allOf: [{$ref: '#/components/schemas/Feedback'}]
          nullable: true
          description: The calling member's own feedback on this briefing version, if any.
