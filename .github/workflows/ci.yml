name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Backend tests exercise the SPA-serving routes (e.g. GET / -> static/index.html).
    # Build outputs are untracked since RC1, so consume the real built frontend from
    # the frontend-build job — the same reality the Docker image ships.
    needs: [frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: static/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          # Minimal env vars for testing (no external services)
          PORT: 8000

      # Hard gate: public copy must not claim capabilities the user path
      # does not deliver (REMEDIATION_PLAN task 1.1). No continue-on-error.
      - name: Claim sweep
        run: python scripts/claim_sweep.py

      - name: Run linting (optional)
        run: |
          pip install flake8
          flake8 main.py database.py report_contract.py report_service.py report_routes.py --max-line-length=120 --ignore=E501,W503
        continue-on-error: true

  contract-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OpenAPI schema drift (v2 report API + legacy routes)
        run: python scripts/check_openapi_drift.py
        env:
          # Minimal env vars for testing (no external services) -- matches
          # the test job; importing main.app doesn't need more than this.
          PORT: 8000

  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          ! grep -rE "(api_key|password|secret)\s*=\s*['\"][^'\"]+['\"]" --include="*.py" . || echo "Warning: Potential hardcoded secrets found"
        continue-on-error: true

      - name: Check requirements for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "Some vulnerabilities found - review required"
        continue-on-error: true

  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: autosafe:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: No committed build assets
        run: |
          if git ls-files --error-unmatch static/index.html >/dev/null 2>&1 || [ -n "$(git ls-files static/assets)" ]; then
            echo '::error::build outputs must not be tracked'
            exit 1
          fi

      - name: Upload frontend static bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: static/

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: static/

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (fully mocked, against the built SPA)
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14

  # The fresh-engineer path: build the real image, run it against a real
  # Postgres, migrate, seed synthetic data, and run the full staging
  # acceptance suite (scripts/staging_acceptance.py) inside the stack.
  staging-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run staging stack + acceptance
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.staging.yml up \
            --build --abort-on-container-exit --exit-code-from acceptance

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --no-color | tail -300

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
